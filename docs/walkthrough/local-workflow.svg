<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="supply-chain-local-title" aria-describedby="supply-chain-local-desc"><title id="supply-chain-local-title">Five stages run from chosen project folders through an offline scan, optional advisory lookups and a graph dashboard to a policy result and candidate events.</title><desc id="supply-chain-local-desc">Moving figure, 10 seconds, looping, no sound. 1. TRIUNA LABS, INC. · SUPPLY CHAIN GRAPH. From selected folders to evidence. What the public skill and local starter do today. Marked CURRENT WORKFLOW. Footer: Triuna Labs, Inc. · Public reusable skill · Real snapshots and dashboards stay private. 2. 01 · CHOOSE: Project roots. Add a folder with the native picker in local serve mode, paste a path, or run bounded discovery. Commands: init · set-root; discover · serve. No whole-computer search. 3. 02 · COLLECT: Offline scan. Read manifests, npm or pnpm locks, source imports, Git, actions, and Python requirements. Commands: scan → snapshot.json. No install or remote fetch. 4. 03 · CHECK (OPTIONAL): Advisory data. Query OSV for resolved npm versions; query npm metadata for deprecation and latest tag. Commands: enrich · details. Shares package names. 5. 04 · EXPLORE: Graph dashboard. Four graph lenses and a start-here panel; what was read, what stayed local, which npm checks never ran. Commands: render · serve. Inspect paths and gaps. 6. 05 · EVALUATE: Policy + events. Apply a versioned policy: freshness, six coverage states, stable IDs. Compare with a chosen baseline. No alerts sent. Commands: evaluate · diff. Unknown is not clean. 7. HOW TO READ THE RESULT. A supported resolved path. 8. A chain: Project, leading to declared request, leading to locked occurrence, leading to versioned artifact. 9. Edges retain scope and file evidence; shared artifacts do not erase per-project paths.. 10. An unknown stays unknown. 11. A chain: Project, leading to source import, with nothing to establish the link to installed version: unknown. 12. No lockfile, unsupported format, failed lookup, or partial scan. States: unqueried · failed · unsupported · stale.. A source import alone does not prove an installed version or vulnerability status..</desc><defs/><g data-layer="bg" aria-hidden="true"><g data-prim="background"><rect width="1600" height="940" fill="#f5f4f0"/></g></g><g data-layer="labels" aria-hidden="true"><g data-prim="title-block"><text x="55" y="62" font-size="13" font-weight="700" letter-spacing="3" fill="#6e6c66">TRIUNA LABS, INC. · SUPPLY CHAIN GRAPH</text><text x="55" y="116" font-size="46" fill="#1d1d1b" font-family="Georgia, 'Times New Roman', serif">From selected folders to evidence</text><text x="55" y="150" font-size="18" fill="#3a3a38">What the public skill and local starter do today</text><text x="55" y="914" font-size="16" fill="#6e6c66">Triuna Labs, Inc. · Public reusable skill · Real snapshots and dashboards stay private</text><g data-prim="legend"><rect x="1343.8" y="47" width="201.2" height="34" rx="17" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="1362.8" y="70" font-size="15" fill="#3a3a38">CURRENT WORKFLOW</text></g></g><g data-prim="panel" opacity="1"><g transform="translate(55 686)"><rect x="0" y="0" width="736" height="190" rx="16" fill="#d5efe0" fill-opacity="0.45" stroke="#2f7a50" stroke-width="2"/><text x="24" y="40" font-size="25" font-weight="600" fill="#1d1d1b">A supported resolved path</text><g data-prim="chain"><rect x="24" y="54" width="81.75" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="36" y="77" font-size="15" fill="#1d1d1b">Project</text><path d="M107.75,71 H128.75" fill="none" stroke="#6e6c66" stroke-width="2.5"/><path d="M133.75,71 L127,66.5 L127,75.5 Z" fill="#6e6c66"/><rect x="135.75" y="54" width="156" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="147.75" y="77" font-size="15" fill="#1d1d1b">declared request</text><path d="M293.75,71 H314.75" fill="none" stroke="#6e6c66" stroke-width="2.5"/><path d="M319.75,71 L313,66.5 L313,75.5 Z" fill="#6e6c66"/><rect x="321.75" y="54" width="164.25" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="333.75" y="77" font-size="15" fill="#1d1d1b">locked occurrence</text><path d="M488,71 H509" fill="none" stroke="#6e6c66" stroke-width="2.5"/><path d="M514,71 L507.25,66.5 L507.25,75.5 Z" fill="#6e6c66"/><rect x="516" y="54" width="172.5" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="528" y="77" font-size="15" fill="#1d1d1b">versioned artifact</text></g><text x="24" y="116" font-size="16" fill="#245c3c">Edges retain scope and file evidence; shared artifacts do not erase per-project</text><text x="24" y="144" font-size="16" fill="#245c3c">paths.</text></g><text x="55" y="668" font-size="13" font-weight="700" letter-spacing="3" fill="#6e6c66">HOW TO READ THE RESULT</text></g><g data-prim="panel" opacity="1"><g transform="translate(809 686)"><rect x="0" y="0" width="736" height="190" rx="16" fill="#fbe7c4" fill-opacity="0.45" stroke="#94600f" stroke-width="2"/><text x="24" y="40" font-size="25" font-weight="600" fill="#1d1d1b">An unknown stays unknown</text><g data-prim="chain"><rect x="24" y="54" width="81.75" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="36" y="77" font-size="15" fill="#1d1d1b">Project</text><path d="M107.75,71 H128.75" fill="none" stroke="#6e6c66" stroke-width="2.5"/><path d="M133.75,71 L127,66.5 L127,75.5 Z" fill="#6e6c66"/><rect x="135.75" y="54" width="131.25" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="147.75" y="77" font-size="15" fill="#1d1d1b">source import</text><path d="M269,71 h5 M290,71 h5" fill="none" stroke="#94600f" stroke-width="3"/><text x="282" y="76" font-size="15" font-weight="700" fill="#6b4a10" text-anchor="middle">?</text><rect x="297" y="54" width="238.5" height="34" rx="8" fill="#ffffff" stroke="#86847c" stroke-width="1.5"/><text x="309" y="77" font-size="15" fill="#1d1d1b">installed version: unknown</text></g><text x="24" y="118" font-size="18" fill="#6b4a10">No lockfile, unsupported format, failed lookup, or partial scan. States:</text><text x="24" y="148" font-size="18" fill="#6b4a10">unqueried · failed · unsupported · stale.</text><text x="24" y="176" font-size="16" fill="#6b4a10">A source import alone does not prove an installed version or vulnerability status.</text></g></g></g><g data-layer="stages" aria-hidden="true"><g data-prim="stage-grid"><g data-prim="stage-card" opacity="1" transform="translate(55 190)"><rect x="0" y="0" width="273.2" height="380" rx="16" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="23" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#1e4fa8">01 · CHOOSE</text><text x="23" y="82" font-size="25" font-weight="600" fill="#1d1d1b">Project roots</text><text x="23" y="120" font-size="18" fill="#3a3a38">Add a folder with the</text><text x="23" y="147" font-size="18" fill="#3a3a38">native picker in local</text><text x="23" y="174" font-size="18" fill="#3a3a38">serve mode, paste a</text><text x="23" y="201" font-size="18" fill="#3a3a38">path, or run bounded</text><text x="23" y="228" font-size="18" fill="#3a3a38">discovery.</text><rect x="23" y="262" width="227.2" height="68" rx="10" fill="#f0efec" stroke="#86847c" stroke-width="1.5"/><text x="35" y="289" font-size="15" fill="#3a3a38" font-family="'DM Mono', Consolas, 'Courier New', monospace">init · set-root</text><text x="35" y="314" font-size="15" fill="#3a3a38" font-family="'DM Mono', Consolas, 'Courier New', monospace">discover · serve</text><text x="23" y="356" font-size="16" fill="#6e6c66">No whole-computer search.</text></g><g data-prim="stage-card" opacity="1" transform="translate(359.2 190)"><rect x="0" y="0" width="273.2" height="380" rx="16" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="23" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#1e4fa8">02 · COLLECT</text><text x="23" y="82" font-size="25" font-weight="600" fill="#1d1d1b">Offline scan</text><text x="23" y="120" font-size="18" fill="#3a3a38">Read manifests, npm or</text><text x="23" y="147" font-size="18" fill="#3a3a38">pnpm locks, source</text><text x="23" y="174" font-size="18" fill="#3a3a38">imports, Git, actions,</text><text x="23" y="201" font-size="18" fill="#3a3a38">and Python requirements.</text><rect x="23" y="287" width="227.2" height="43" rx="10" fill="#f0efec" stroke="#86847c" stroke-width="1.5"/><text x="35" y="314" font-size="15" fill="#3a3a38" font-family="'DM Mono', Consolas, 'Courier New', monospace">scan → snapshot.json</text><text x="23" y="356" font-size="16" fill="#6e6c66">No install or remote fetch.</text></g><g data-prim="stage-join" opacity="1" transform=""><path d="M330.2,380 H352.2" fill="none" stroke="#6e6c66" stroke-width="3"/><path d="M357.2,380 L349.7,375 L349.7,385 Z" fill="#6e6c66"/></g><g data-prim="stage-card" opacity="1" transform="translate(663.4 190)"><rect x="0" y="0" width="273.2" height="380" rx="16" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="23" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#1e4fa8">03 · CHECK (OPTIONAL)</text><text x="23" y="82" font-size="25" font-weight="600" fill="#1d1d1b">Advisory data</text><text x="23" y="120" font-size="18" fill="#3a3a38">Query OSV for resolved</text><text x="23" y="147" font-size="18" fill="#3a3a38">npm versions; query npm</text><text x="23" y="174" font-size="18" fill="#3a3a38">metadata for deprecation</text><text x="23" y="201" font-size="18" fill="#3a3a38">and latest tag.</text><rect x="23" y="287" width="227.2" height="43" rx="10" fill="#fbe7c4" stroke="#94600f" stroke-width="1.5"/><text x="35" y="314" font-size="15" fill="#6b4a10" font-family="'DM Mono', Consolas, 'Courier New', monospace">enrich · details</text><text x="23" y="356" font-size="16" fill="#6e6c66">Shares package names.</text></g><g data-prim="stage-join" opacity="1" transform=""><path d="M634.4,380 H656.4" fill="none" stroke="#6e6c66" stroke-width="3"/><path d="M661.4,380 L653.9,375 L653.9,385 Z" fill="#6e6c66"/></g><g data-prim="stage-card" opacity="1" transform="translate(967.6 190)"><rect x="0" y="0" width="273.2" height="380" rx="16" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="23" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#1e4fa8">04 · EXPLORE</text><text x="23" y="82" font-size="25" font-weight="600" fill="#1d1d1b">Graph dashboard</text><text x="23" y="120" font-size="18" fill="#3a3a38">Four graph lenses and a</text><text x="23" y="147" font-size="18" fill="#3a3a38">start-here panel; what</text><text x="23" y="174" font-size="18" fill="#3a3a38">was read, what stayed</text><text x="23" y="201" font-size="18" fill="#3a3a38">local, which npm checks</text><text x="23" y="228" font-size="18" fill="#3a3a38">never ran.</text><rect x="23" y="287" width="227.2" height="43" rx="10" fill="#f0efec" stroke="#86847c" stroke-width="1.5"/><text x="35" y="314" font-size="15" fill="#3a3a38" font-family="'DM Mono', Consolas, 'Courier New', monospace">render · serve</text><text x="23" y="356" font-size="16" fill="#6e6c66">Inspect paths and gaps.</text></g><g data-prim="stage-join" opacity="1" transform=""><path d="M938.6,380 H960.6" fill="none" stroke="#6e6c66" stroke-width="3"/><path d="M965.6,380 L958.1,375 L958.1,385 Z" fill="#6e6c66"/></g><g data-prim="stage-card" opacity="1" transform="translate(1271.8 190)"><rect x="0" y="0" width="273.2" height="380" rx="16" fill="#ffffff" stroke="#86847c" stroke-width="2"/><text x="23" y="42" font-size="15" font-weight="700" letter-spacing="2" fill="#1e4fa8">05 · EVALUATE</text><text x="23" y="82" font-size="25" font-weight="600" fill="#1d1d1b">Policy + events</text><text x="23" y="120" font-size="18" fill="#3a3a38">Apply a versioned</text><te